
name: NEXORA AI - Cloud APK Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'NexoraAI.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: nexora-cloud-build
  cancel-in-progress: true

jobs:
  build:
    name: Build NEXORA AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify ZIP
        run: |
          set -euo pipefail

          if [ ! -f NexoraAI.zip ]; then
            echo "::error::NexoraAI.zip not found"
            exit 1
          fi

          unzip -t NexoraAI.zip
          ls -lh NexoraAI.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q NexoraAI.zip -d extracted
          echo "Project extracted."

      - name: Detect Gradle Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          ROOT="${SETTINGS%/*}"
          PROPS="$ROOT/gradle/wrapper/gradle-wrapper.properties"
          WRAPPER="$ROOT/gradlew"
          JAR="$ROOT/gradle/wrapper/gradle-wrapper.jar"

          if [ ! -f "$ROOT/build.gradle" ] && \
             [ ! -f "$ROOT/build.gradle.kts" ]; then
            echo "::error::Root build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROPS" ]; then
            echo "::error::Gradle wrapper properties missing."
            exit 1
          fi

          VERSION=$(sed -nE \
            's/.*gradle-([0-9]+(\.[0-9]+)*)-(bin|all)\.zip.*/\1/p' \
            "$PROPS" | head -1)

          if [ -z "$VERSION" ]; then
            echo "::error::Unable to detect Gradle version."
            exit 1
          fi

          USE_WRAPPER=false

          if [ -f "$WRAPPER" ] && [ -f "$JAR" ]; then
            chmod +x "$WRAPPER"
            USE_WRAPPER=true
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "wrapper=$USE_WRAPPER" >> "$GITHUB_OUTPUT"

          echo "Project: $ROOT"
          echo "Gradle: $VERSION"
          echo "Wrapper: $USE_WRAPPER"

      - name: Setup Gradle
        if: steps.project.outputs.wrapper != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.project.outputs.version }}

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.project.outputs.wrapper }}" = "true" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          find extracted -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} artifacts/ \;

          if ! find artifacts -name '*.apk' | grep -q .; then
            echo "::error::No APK generated."
            exit 1
          fi

          ls -lh artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
