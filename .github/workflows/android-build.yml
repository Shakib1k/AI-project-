
name: NEXORA AI - Cloud APK Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'NexoraAI-starter.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: nexora-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build NEXORA AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "NexoraAI-starter.zip" ]; then
            echo "::error::NexoraAI-starter.zip not found!"
            exit 1
          fi

          echo "Project ZIP found."
          unzip -t NexoraAI-starter.zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          unzip -q NexoraAI-starter.zip -d extracted

          echo "Project extracted successfully."

      - name: Detect Android Gradle Project
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android Gradle settings file not found."
            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="${SETTINGS%/*}"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Root build.gradle file not found."
            exit 1
          fi

          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          WRAPPER="$PROJECT_DIR/gradlew"
          WRAPPER_JAR="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"

          if [ ! -f "$PROPS" ]; then
            echo "::error::gradle-wrapper.properties is missing."
            exit 1
          fi

          VERSION=$(sed -nE \
            's#.*gradle-([0-9]+(\.[0-9]+)*)-(bin|all)\.zip.*#\1#p' \
            "$PROPS" | head -1)

          if [ -z "$VERSION" ]; then
            echo "::error::Could not detect Gradle version."
            exit 1
          fi

          USE_WRAPPER=false

          if [ -f "$WRAPPER" ] && [ -f "$WRAPPER_JAR" ]; then
            chmod +x "$WRAPPER"
            USE_WRAPPER=true
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "use_wrapper=$USE_WRAPPER" >> "$GITHUB_OUTPUT"

          echo "Project: $PROJECT_DIR"
          echo "Gradle: $VERSION"
          echo "Wrapper available: $USE_WRAPPER"

      - name: Setup Gradle
        if: steps.detect.outputs.use_wrapper != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.detect.outputs.gradle_version }}

      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting NEXORA AI APK build..."

          if [ "${{ steps.detect.outputs.use_wrapper }}" = "true" ]; then
            bash ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

          echo "APK build completed."

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_COUNT=$(find extracted -type f \
            -path '*/build/outputs/apk/debug/*.apk' | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No Debug APK was generated."
            exit 1
          fi

          echo "Found $APK_COUNT APK file(s)."
          find extracted -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec ls -lh {} \;

      - name: Upload NEXORA AI APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
